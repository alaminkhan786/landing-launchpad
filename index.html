<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Launchpad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="Assets/Hero-bg.png" alt="Hero-bg">
        <nav>
            <h1 class="inter-font">LOGO</h1>
            <button class="btn raleway-font">Sign Up</button>
        </nav>
        <div class="hero-area">
            <h2 class="raleway-font">Cool Dark UI Template for Webflow Agencies!</h2>
            <button class="btn raleway-font">Stay Focused</button>
        </div>
    </header>
    <main>
        <section class="action raleway-font">
            <div class="action-text">
                <h3 class="">See It in Action</h3>
                <p class="">Explore the live preview and imagine your brand in this bold new look.</p>
                <button class="btn raleway-font">Launch Live Preview</button>
            </div>
            <div class="action-img">
                <img src="Assets/wc-mini.png" alt="Webflow Mini">
            </div>
        </section>
        <section class="users-info">
            <div class="user-text">
                <h1 class="raleway-font">Joined Thousands of Productive Users</h1>
            </div>
            <div class="user-amount inter-font">
                <div class="active">
                    <h1>50K</h1>
                    <p>Active Users</p>
                </div>
                <div class="focus">
                    <h1>2M+</h1>
                    <p>Focus Sessions</p>
                </div>
                <div class="rate">
                    <h1>95%</h1>
                    <p>Satisfaction Rate</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
